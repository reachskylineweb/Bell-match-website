<video controls="" id="lightboxVideo" muted="" playsinline="" style="display:none; max-width: 90%; max-height: 82vh; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);"></video>
<iframe id="lightboxIframe" style="display:none; width: 100%; aspect-ratio: 16/9; max-height: 82vh; border: none; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</div>
</div>
</main>
<div id="footer-component"></div>
<!-- Scripts -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="main.js?v=5"></script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Gallery Filtering Logic
            const filterBtns = document.querySelectorAll('.filter-btn');
            const galleryItems = document.querySelectorAll('.gallery-item');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active state
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // Filter items
                    const filterValue = btn.getAttribute('data-filter');
                    galleryItems.forEach(item => {
                        const itemCategory = (item.getAttribute('data-category') || '').trim();
                        const hasVideo = item.hasAttribute('data-video');

                        if (filterValue === 'all') {
                            item.style.display = 'block';
                        } else if (filterValue === 'video') {
                            item.style.display = (hasVideo || itemCategory.includes('video')) ? 'block' : 'none';
                        } else if (itemCategory.split(' ').includes(filterValue)) {
                            item.style.display = 'block';
                        } else {
                            item.style.display = 'none';
                        }
                    });
                });
            });

            // Lightbox Logic
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxVideo = document.getElementById('lightboxVideo');
            const lightboxIframe = document.getElementById('lightboxIframe');
            const lightboxClose = document.getElementById('lightboxClose');

            galleryItems.forEach(item => {
                item.addEventListener('click', () => {
                    const videoSrc = item.getAttribute('data-video');
                    if (videoSrc) {
                        lightboxImg.style.display = 'none';
                        if (videoSrc.includes('youtube.com') || videoSrc.includes('youtu.be')) {
                            lightboxVideo.style.display = 'none';
                            lightboxVideo.pause();
                            lightboxVideo.src = '';
                            lightboxIframe.style.display = 'block';
                            let embedSrc = videoSrc;
                            const isIntroVideo = videoSrc.includes('EGKJSDhPCHs');
                            const originParam = window.location.origin ? `&origin=${encodeURIComponent(window.location.origin)}` : '';
                            if (videoSrc.includes('watch?v=')) {
                                const id = videoSrc.split('watch?v=')[1].split('&')[0];
                                if (isIntroVideo) {
                                    embedSrc = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&rel=0${originParam}`;
                                } else {
                                    embedSrc = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=0&disablekb=1&enablejsapi=1&rel=0${originParam}`;
                                }
                            } else {
                                if (isIntroVideo) {
                                    embedSrc += (embedSrc.includes('?') ? '&' : '?') + `autoplay=1&enablejsapi=1&rel=0${originParam}`;
                                } else {
                                    embedSrc += (embedSrc.includes('?') ? '&' : '?') + `autoplay=1&mute=1&controls=0&disablekb=1&enablejsapi=1&rel=0${originParam}`;
                                }
                            }
                            lightboxIframe.src = embedSrc;

                            if (!isIntroVideo) {
                                const enforceMute = () => {
                                    try {
                                        if (lightboxIframe && lightboxIframe.contentWindow) {
                                            lightboxIframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                                            lightboxIframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[0]}', '*');
                                        }
                                    } catch (err) {}
                                };
                                lightboxIframe.onload = enforceMute;
                                setTimeout(enforceMute, 250);
                                setTimeout(enforceMute, 700);
                                setTimeout(enforceMute, 1400);
                            }
                        } else {
                            if (lightboxIframe) {
                                lightboxIframe.style.display = 'none';
                                lightboxIframe.src = '';
                            }
                            lightboxVideo.style.display = 'block';
                            lightboxVideo.src = videoSrc;
                            lightboxVideo.muted = true; // Prevents background ambient voice/noise from playing
                            lightboxVideo.currentTime = 0;
                            const playPromise = lightboxVideo.play();
                            if (playPromise !== undefined) {
                                playPromise.catch(err => {
                                    console.log('Autoplay handled:', err);
                                });
                            }
                        }
                    } else {
                        if (lightboxIframe) {
                            lightboxIframe.style.display = 'none';
                            lightboxIframe.src = '';
                        }
                        lightboxVideo.style.display = 'none';
                        lightboxVideo.pause();
                        lightboxVideo.src = '';
                        lightboxImg.style.display = 'block';
                        const imgSrc = item.querySelector('img').getAttribute('src');
                        lightboxImg.setAttribute('src', imgSrc);
                    }
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden'; // Prevent scrolling
                });
            });

            const closeLightbox = () => {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
                if (lightboxVideo) {
                    lightboxVideo.pause();
                    lightboxVideo.currentTime = 0;
                    lightboxVideo.src = '';
                }
                if (lightboxIframe) {
                    try {
                        lightboxIframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                        lightboxIframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[0]}', '*');
                        lightboxIframe.contentWindow.postMessage('{"event":"command","func":"stopVideo","args":""}', '*');
                    } catch (err) {}
                    lightboxIframe.onload = null;
                    lightboxIframe.src = 'about:blank';
                    lightboxIframe.style.display = 'none';
                }
            };

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            });
        });
    </script>
</body>
</html>
