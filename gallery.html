        /* Gallery Styles */
        .gallery-filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }
        .filter-btn {
            padding: 0.5rem 1.5rem;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transition-fast);
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary-red);
            color: white;
            border-color: var(--primary-red);
        }
        .masonry-grid {
            column-count: 3;
            column-gap: 1.5rem;
        }
        @media (max-width: 992px) {
            .masonry-grid { column-count: 2; }
        }
        @media (max-width: 576px) {
            .masonry-grid { column-count: 1; }
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: var(--shadow-md);
        }
        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        .gallery-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        .gallery-overlay i {
            color: white;
            font-size: 2rem;
        }
        
        /* Video Item Specific Styles */
        .gallery-item[data-video] .gallery-overlay {
            opacity: 1; /* Always visible */
            background: rgba(0,0,0,0.2);
        }
        .gallery-item[data-video] .gallery-overlay i {
            font-size: 3.5rem;
            color: rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.7));

        }
        .gallery-item[data-video]:hover .gallery-overlay {
            background: rgba(0,0,0,0.4);
        }
        .gallery-item[data-video]:hover .gallery-overlay i {
            transform: scale(1.15);

        }

        /* Lightbox Styles */

            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .lightbox.active {

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.3s ease;

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Gallery Filtering Logic
            const filterBtns = document.querySelectorAll('.filter-btn');
            const galleryItems = document.querySelectorAll('.gallery-item');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active state
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // Filter items
                    const filterValue = btn.getAttribute('data-filter');
                    galleryItems.forEach(item => {
                        if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                            item.style.display = 'block';
                        } else {
                            item.style.display = 'none';
                        }
                    });
                });
            });

            // Lightbox Logic
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxVideo = document.getElementById('lightboxVideo');
            const lightboxClose = document.getElementById('lightboxClose');

            galleryItems.forEach(item => {
                item.addEventListener('click', () => {
                    const videoSrc = item.getAttribute('data-video');
                    if (videoSrc) {
                        lightboxImg.style.display = 'none';
                        lightboxVideo.style.display = 'block';
                        lightboxVideo.src = videoSrc;
                        lightboxVideo.play();
                    } else {
                        lightboxVideo.style.display = 'none';
                        lightboxVideo.pause();
                        lightboxImg.style.display = 'block';
                        const imgSrc = item.querySelector('img').getAttribute('src');
                        lightboxImg.setAttribute('src', imgSrc);
                    }
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden'; // Prevent scrolling
                });
            });

            const closeLightbox = () => {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
                if(lightboxVideo) lightboxVideo.pause();
            };

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });
        });
    </script>
