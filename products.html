        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const container = document.getElementById('products-container');
                const artWrap = document.getElementById('match-artwork');
                const matchsticks = [];
                
                // Define letters based on strokes (x, y, length, angle)
                const letters = {
                    'A': [{x:0, y:0, w:100, a:90}, {x:50, y:0, w:100, a:90}, {x:0, y:0, w:50, a:0}, {x:0, y:50, w:50, a:0}],
                    'C': [{x:0, y:0, w:100, a:90}, {x:0, y:0, w:50, a:0}, {x:0, y:100, w:50, a:0}],
                    'E': [{x:0, y:0, w:100, a:90}, {x:0, y:0, w:50, a:0}, {x:0, y:50, w:40, a:0}, {x:0, y:100, w:50, a:0}],
                    'F': [{x:0, y:0, w:100, a:90}, {x:0, y:0, w:50, a:0}, {x:0, y:50, w:40, a:0}],
                    'H': [{x:0, y:0, w:100, a:90}, {x:50, y:0, w:100, a:90}, {x:0, y:50, w:50, a:0}],
                    'I': [{x:25, y:0, w:100, a:90}, {x:0, y:0, w:50, a:0}, {x:0, y:100, w:50, a:0}],
                    'M': [{x:0, y:0, w:100, a:90}, {x:50, y:0, w:100, a:90}, {x:0, y:0, w:40, a:45}, {x:50, y:0, w:40, a:135}],
                    'P': [{x:0, y:0, w:100, a:90}, {x:0, y:0, w:45, a:0}, {x:45, y:0, w:50, a:90}, {x:0, y:50, w:45, a:0}],
                    'R': [{x:0, y:0, w:100, a:90}, {x:0, y:0, w:45, a:0}, {x:45, y:0, w:50, a:90}, {x:0, y:50, w:45, a:0}, {x:0, y:50, w:60, a:55}],
                    'S': [{x:0, y:0, w:50, a:0}, {x:0, y:0, w:50, a:90}, {x:0, y:50, w:50, a:0}, {x:50, y:50, w:50, a:90}, {x:0, y:100, w:50, a:0}],
                    'T': [{x:0, y:0, w:50, a:0}, {x:25, y:0, w:100, a:90}],
                    'U': [{x:0, y:0, w:100, a:90}, {x:50, y:0, w:100, a:90}, {x:0, y:100, w:50, a:0}],
                    'Y': [{x:0, y:0, w:45, a:55}, {x:50, y:0, w:45, a:125}, {x:25, y:40, w:60, a:90}]
                };

                const lines = ["PREMIUM", "SAFETY", "MATCHES"];
                const scale = 0.7; // slightly smaller to fit 3 lines safely
                const letterSpacing = 70 * scale;
                const lineSpacing = 130 * scale;
                const containerWidth = 800; // Match the CSS width

                let offsetY = 50; // start a bit lower

                // Function to create a matchstick element
                function createMatch(w, x, y, a, isBg=false) {
                    const m = document.createElement('div');
                    m.className = 'matchstick' + (isBg ? ' bg' : '');
                    m.style.width = w + 'px';
                    // Store final positions for animation
                    m.dataset.fx = x;
                    m.dataset.fy = y;
                    m.dataset.fa = a;
                    // Initial random positions off-screen or scattered
                    const startX = (Math.random() - 0.5) * 1500;
                    const startY = (Math.random() - 0.5) * 1500;
                    const startA = Math.random() * 720 - 360;
                    
                    m.style.left = startX + 'px';
                    m.style.top = startY + 'px';
                    m.style.transform = `rotate(${startA}deg)`;
                    
                    container.appendChild(m);
                    matchsticks.push(m);
                    return m;
                }

                // Build the text lines
                lines.forEach(word => {
                    let totalWidth = word.length * letterSpacing;
                    let startX = (containerWidth - totalWidth) / 2;
                    let offsetX = startX;
                    
                    word.split('').forEach(char => {
                        const strokes = letters[char];
                        if (strokes) {
                            strokes.forEach(s => {
                                createMatch(s.w * scale, offsetX + s.x * scale, offsetY + s.y * scale, s.a);
                            });
                        }
                        offsetX += letterSpacing;
                    });
                    offsetY += lineSpacing;
                });

                // Background matchsticks removed as requested

                // GSAP Animations
                const tl = gsap.timeline();

                // 1. Animate matchsticks assembling
                tl.to(matchsticks, {
                    x: function(i, el) { return el.dataset.fx - parseFloat(el.style.left); },
                    y: function(i, el) { return el.dataset.fy - parseFloat(el.style.top); },
                    rotation: function(i, el) { return el.dataset.fa; },
                    opacity: 1,
                    duration: 5,
                    stagger: { amount: 3.5, from: "random" },
                    ease: "expo.out"
                });

                // 2. Fade in CTA buttons
                tl.to("#cta-container", { opacity: 1, y: -20, duration: 1, ease: "power2.out" }, "-=1.5");

                // Idle floating animation
                gsap.to(artWrap, {
                    y: 15,
                    rotationX: 2,
                    rotationY: -2,
                    duration: 5,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });

                // Mouse movement parallax (3D tilt)
                document.addEventListener("mousemove", (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 60;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 60;
                    gsap.to(artWrap, {
                        rotationY: -xAxis,
                        rotationX: yAxis,
                        duration: 1.5,
                        ease: "power2.out"
                    });
                });
            });
        </script>

            <script>
                async function loadProducts(retryCount = 0) {
                    const container = document.getElementById('productsContainer');
                    try {
                        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                            ? 'http://localhost:5000'
                            : '';
                        const [prodRes, mainCatRes, subCatRes] = await Promise.all([
                            fetch(`${API_BASE}/api/products`),
                            fetch(`${API_BASE}/api/categories/main`),
                            fetch(`${API_BASE}/api/categories/sub`)
                        ]);
                        
                        if (!prodRes.ok || !mainCatRes.ok || !subCatRes.ok) {
                            throw new Error('Server response not OK');
                        }
                        
                        const products = await prodRes.json();
                        const mainCategories = await mainCatRes.json();
                        const subCategories = await subCatRes.json();
                        
                        if (products.length === 0) {
                            container.innerHTML = '<div style="text-align: center;"><h3>No products available yet.</h3></div>';
                            return;
                        }

                        // Map category IDs to names
                        const mainCatMap = {};
                        mainCategories.forEach(mc => mainCatMap[mc.id] = mc.name);
                        
                        const subCatMap = {};
                        subCategories.forEach(sc => subCatMap[sc.id] = sc.name);
                        
                        // Map main categories to their available sub-categories
                        const mainToSubs = {};
                        products.forEach(p => {
                            const mainName = mainCatMap[p.main_category_id] || 'Uncategorized';
                            const subName = subCatMap[p.sub_category_id] || 'Others';
                            if (!mainToSubs[mainName]) mainToSubs[mainName] = new Set();
                            mainToSubs[mainName].add(subName);
                        });

                        let html = `
                            <div class="text-center" style="margin-bottom: 3rem;">
                                <div style="display: flex; justify-content: center; margin-bottom: 2rem;">
                                    <div style="position: relative; width: 100%; max-width: 500px;">
                                        <i class="fas fa-search" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #888; font-size: 1.1rem;"></i>
                                        <input type="text" id="globalProductSearch" placeholder="Search products by code, size, etc..." onkeyup="searchProducts(this.value)" style="width: 100%; padding: 12px 20px 12px 50px; border-radius: 30px; border: 2px solid #eaeaea; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); font-size: 1.1rem; outline: none; transition: border-color 0.3s; background: #fff;">
                                    </div>
                                </div>
                                <div id="main-filters" style="display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; gap: 6px;">
                                    <button class="btn btn-outline-primary main-filter-btn" data-filter="all" onclick="filterMain('all', this)" style="margin: 4px;">All Products</button>
                        `;
                        
                        mainCategories.forEach(mc => {
                            const mainCat = mc.name;
                            if (mainToSubs[mainCat]) {
                                html += `<button class="btn btn-outline-primary main-filter-btn" data-filter="${mainCat.replace(/"/g, '&quot;')}" onclick="filterMain('${mainCat.replace(/'/g, "\\'")}', this)" style="margin: 4px;">${mainCat}</button>`;
                            }
                        });
                        if (mainToSubs['Uncategorized']) {
                            html += `<button class="btn btn-outline-primary main-filter-btn" data-filter="Uncategorized" onclick="filterMain('Uncategorized', this)" style="margin: 4px;">Uncategorized</button>`;
                        }
                        
                        html += `
                                </div>
                                <div id="sub-filters-container" style="display: none !important; flex-wrap: wrap !important; justify-content: center !important; align-items: center !important; max-width: 100%; box-sizing: border-box; margin-bottom: 2rem; gap: 6px;">
                                    <!-- Dynamic sub filters go here -->
                                </div>
                            </div>
                        `;

                        // Generate Global Product Grid
                        html += `<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 5rem; margin-top: 3rem;" id="global-grid">`;
                        
                        products.forEach(p => {
                            const mainCat = mainCatMap[p.main_category_id] || 'Uncategorized';
                            const subCat = subCatMap[p.sub_category_id] || 'Others';
                            const bgImage = p.image_url.startsWith('http') ? p.image_url : (API_BASE + p.image_url);
                            
                            let parsedSpecs = [];
                            try {
                                parsedSpecs = JSON.parse(p.specifications || '[]');
                            } catch(e) {}
                            
                            // Static specs template
                            if (parsedSpecs.length === 0) {
                                parsedSpecs.push({key: 'Box Size', val: p.box_size || '-'});
                                parsedSpecs.push({key: 'No. of sticks', val: p.no_of_sticks || '-'});
                                parsedSpecs.push({key: 'Stick Length', val: p.stick_length || '-'});
                                parsedSpecs.push({key: 'No. of Boxes/Carton', val: p.no_of_boxes_carton || '-'});
                            }
                            
                            let specsHtml = `
                                <ul style="list-style: none; padding: 0; margin-bottom: 0.5rem; color: #4b5563; font-size: 0.95rem; overflow-x: hidden;">
                                    <li style="display: flex; align-items: flex-start; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid #f3f4f6;">
                                        <span style="flex: 0 0 45%; max-width: 130px; font-weight: bold; color: #1f2937; padding-right: 5px; line-height: 1.3;">Product Code</span>
                                        <span style="margin-right: 12px; flex-shrink: 0; line-height: 1.3; color: #9ca3af;">-</span>
                                        <span style="flex: 1; word-break: break-word; line-height: 1.3; color: #111827; font-weight: 600; font-size: 1.05rem;">${p.product_code || '-'}</span>
                                    </li>
                                </ul>
                                <ul class="spec-list" style="list-style: none; padding: 0; margin-bottom: 0; color: #4b5563; font-size: 0.95rem; max-height: 250px; overflow-y: auto; overflow-x: hidden; padding-right: 5px;">
                                    ${parsedSpecs.map(s => `
                                        <li style="display: flex; align-items: flex-start; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid #f3f4f6;">
                                            <span style="flex: 0 0 45%; max-width: 130px; font-weight: bold; color: #1f2937; padding-right: 5px; line-height: 1.3;">${s.key || '-'}</span>
                                            <span style="margin-right: 12px; flex-shrink: 0; line-height: 1.3; color: #9ca3af;">-</span>
                                            <span style="flex: 1; word-break: break-word; line-height: 1.3; color: #111827; font-weight: 600; font-size: 1.05rem;">${s.val || '-'}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            `;

                            html += `
                                <div class="product-card global-product" data-main="${mainCat.replace(/"/g, '&quot;')}" data-sub="${subCat.replace(/"/g, '&quot;')}" style="background: white; border: 1px solid #f3f4f6; border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); transition: all 0.1s ease-out; display: flex; flex-direction: column; height: 100%;">
                                    <div style="height: 250px; width: 100%; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; background-color: #f8f9fa; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;">
                                        <img class="main-img" src="${bgImage}" loading="lazy" alt="Product" style="width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2;">
                                    </div>
                                    <div style="padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; background-color: #ffffff;">
                                        <div style="flex-grow: 1;">
                                            ${specsHtml}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        
                        html += `</div>`;
                        container.innerHTML = html;
                        
                        // Store the mainToSubs mapping globally for the filter function
                        window.globalMainToSubs = {};
                        for (const key in mainToSubs) {
                            window.globalMainToSubs[key] = [];
                            subCategories.forEach(sc => {
                                if (mainToSubs[key].has(sc.name)) {
                                    window.globalMainToSubs[key].push(sc.name);
                                }
                            });
                            if (mainToSubs[key].has('Others')) {
                                window.globalMainToSubs[key].push('Others');
                            }
                        }
                        
                        // Default to the first category instead of "All Products"
                        setTimeout(() => {
                            const firstCategoryBtn = document.querySelectorAll('.main-filter-btn')[1]; // Index 0 is 'all'
                            if (firstCategoryBtn) {
                                firstCategoryBtn.click();
                            }
                        }, 50);
                        
                    } catch (err) {
                        console.error(err);
                        if (retryCount < 3) {
                            container.innerHTML = `
                                <div class="text-center" style="padding: 4rem;">
                                    <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-red);"></i>
                                    <p class="mt-3" style="color: #4b5563; font-weight: 500;">Connecting to cloud server (waking up instance)...</p>
                                </div>
                            `;
                            setTimeout(() => loadProducts(retryCount + 1), 3000);
                            return;
                        }
                        container.innerHTML = `
                            <div style="text-align: center; padding: 4rem 1rem;">
                                <p style="color: #dc2626; font-size: 1.1rem; margin-bottom: 1.25rem; font-weight: 600;">Unable to connect to the cloud server.</p>
                                <button onclick="loadProducts(0)" class="btn btn-outline-primary" style="padding: 10px 24px; border-radius: 25px; font-weight: 600; cursor: pointer;">
                                    <i class="fas fa-redo-alt" style="margin-right: 6px;"></i> Retry Loading
                                </button>
                            </div>
                        `;
                    }
                }
                document.addEventListener('DOMContentLoaded', () => loadProducts(0));

                // Global filter variables
                let currentMainFilter = 'all';
                let currentSubFilter = 'all';
                let currentSearchQuery = '';

                window.applyFilters = function() {
                    document.querySelectorAll('.global-product').forEach(card => {
                        const mainMatch = currentMainFilter === 'all' || card.getAttribute('data-main') === currentMainFilter;
                        const subMatch = currentSubFilter === 'all' || card.getAttribute('data-sub') === currentSubFilter;
                        
                        // Search match looks at the text inside the card (which includes product code and specs)
                        const searchMatch = currentSearchQuery === '' || card.textContent.toLowerCase().includes(currentSearchQuery);
                        
                        if (mainMatch && subMatch && searchMatch) {
                            card.style.display = 'flex';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                };

                window.searchProducts = function(query) {
                    currentSearchQuery = query.toLowerCase();
                    if (query.trim() !== '' && currentMainFilter !== 'all') {
                        const allBtn = document.querySelector('.main-filter-btn[data-filter="all"]');
                        if (allBtn) {
                            allBtn.click();
                            return; // filterMain will automatically call applyFilters
                        }
                    }
                    applyFilters();
                };

                window.filterMain = function(mainCat, btnElem) {
                    currentMainFilter = mainCat;
                    currentSubFilter = 'all'; // reset sub filter when main changes
                    
                    // Update main buttons immediately for fast UI feedback
                    document.querySelectorAll('.main-filter-btn').forEach(btn => {
                        btn.classList.remove('btn-primary');
                        btn.classList.add('btn-outline-primary');
                    });
                    btnElem.classList.remove('btn-outline-primary');
                    btnElem.classList.add('btn-primary');

                    // Defer heavy DOM manipulation to let button state paint first
                    setTimeout(() => {
                        const subContainer = document.getElementById('sub-filters-container');
                        
                        if (mainCat === 'all') {
                            subContainer.style.setProperty('display', 'none', 'important');
                            applyFilters();
                        } else {
                            // Generate sub buttons
                            const subs = window.globalMainToSubs[mainCat] || [];
                            if (subs.length > 0 && !(subs.length === 1 && subs[0] === 'Others')) {
                                subContainer.style.setProperty('display', 'flex', 'important');
                                subContainer.style.setProperty('flex-wrap', 'wrap', 'important');
                                let subHtml = `<button class="btn btn-sm btn-secondary sub-filter-btn" onclick="filterSub('all', this)" style="margin: 3px;">All ${mainCat}</button>`;
                                subs.forEach(sub => {
                                    if (sub !== 'Others') {
                                        subHtml += `<button class="btn btn-sm btn-outline-secondary sub-filter-btn" onclick="filterSub('${sub.replace(/'/g, "\\'")}', this)" style="margin: 3px;">${sub}</button>`;
                                    }
                                });
                                if (subs.includes('Others')) {
                                    subHtml += `<button class="btn btn-sm btn-outline-secondary sub-filter-btn" onclick="filterSub('Others', this)" style="margin: 3px;">Others</button>`;
                                }
                                subContainer.innerHTML = subHtml;
                            } else {
                                subContainer.style.setProperty('display', 'none', 'important');
                            }
                            
                            applyFilters();
                        }
                    }, 10);
                };
                
                window.filterSub = function(subCat, btnElem) {
                    currentSubFilter = subCat;
                    
                    // Update sub buttons immediately for fast UI feedback
                    document.querySelectorAll('.sub-filter-btn').forEach(btn => {
                        btn.classList.remove('btn-secondary');
                        btn.classList.add('btn-outline-secondary');
                    });
                    btnElem.classList.remove('btn-outline-secondary');
                    btnElem.classList.add('btn-secondary');
                    
                    // Defer heavy DOM manipulation
                    setTimeout(() => {
                        applyFilters();
                    }, 10);
                };
            </script>
        </div>
    </section>    <div id="footer-component"></div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="main.js?v=5"></script>
</body>
</html>
